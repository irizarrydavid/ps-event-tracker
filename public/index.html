<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- PWA / Home Screen Icon -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PS Event Tracker">
    <meta name="theme-color" content="#0D2547">

    <!-- App Icon — CUNY Public Safety Shield -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/shield-icon.png">
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/shield-icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="CUNY Public Safety Department — Event Management Tracker. Bernard Baruch College — Authorized Personnel Only." />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="CUNY PS Event Management Tracker">
    <meta property="og:description" content="Bernard Baruch College Public Safety — Authorized Personnel Only">
    <meta property="og:image" content="%PUBLIC_URL%/shield-icon.png">

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <title>CUNY PS Event Management Tracker</title>
  </head>
